name: Release Build

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions: write-all
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # 计算正式 release 版本（来自 tauri.conf.json，无 preview 后缀）
  prepare:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute Release Version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release version: ${VERSION}"

  # 所有平台在同一个矩阵 job 中构建，产物由 upload-artifact 统一收集，
  # 最后由 release-update 统一上传到 v$VERSION release
  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Configure Fast APT Mirror
        if: matrix.os == 'ubuntu-22.04'
        uses: vegardit/fast-apt-mirror.sh@v1
        with: # the following parameters are listed with their action default values and are optional
          healthchecks: 20 # Number of mirrors from the mirrors list to check for availability and up-to-dateness
          speedtests: 10 # Maximum number of healthy mirrors to test for speed
          parallel: 2 # Number of parallel speed tests
          sample-size: 1024 # Number of kilobytes to download during the speed from each mirror
          sample-time: 3 # Maximum number of seconds within the sample download from a mirror must finish
          country: "" # The country code for selecting Ubuntu mirrors. If not set, defaults to http://mirrors.ubuntu.com/mirrors.txt
          exclude-current: false # If set to "true", don't include the current APT mirror in the speed tests
          configure-mirror: auto # Whether to configure the APT mirror: auto, true, or false

      - name: Install Packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Binstall
        if: matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu'
        uses: cargo-bins/cargo-binstall@c06f6a0003f7c6165a00c89d1697731c9e8a5c72 # main

      - name: Install Cross
        if: matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo binstall -y cross

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm check --target ${{ matrix.target }} --no-confirm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}

      - name: Tauri build (linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}
        run: |
          pnpm build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Tauri build (linux cross)
        if: matrix.os == 'ubuntu-22.04' && matrix.target != 'x86_64-unknown-linux-gnu'
        env:
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}
        run: |
          pnpm build -r cross --target ${{ matrix.target }} -b deb,rpm

      - name: Tauri build (windows/macos)
        if: matrix.os != 'ubuntu-22.04'
        shell: bash
        env:
          CLASH_VERGE_SELF_SERVICE_PSK: ${{secrets.CLASH_VERGE_SELF_SERVICE_PSK}}
        run: |
          pnpm build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Stage release packages with platform and architecture
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            *windows*) OS=Windows ;;
            *apple-darwin) OS=Macos ;;
            *linux*) OS=Linux ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          case "$TARGET" in
            *x86_64*) ARCH=x86_64 ;;
            *aarch64*) ARCH=aarch64 ;;
            *) echo "Unsupported architecture: $TARGET" >&2; exit 1 ;;
          esac
          mkdir -p release-assets
          find "target/$TARGET/release/bundle" -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) \
            -print0 | while IFS= read -r -d '' file; do
              extension="${file##*.}"
              cp "$file" "release-assets/ClashMorden_${VERSION}_${OS}_${ARCH}.${extension}"
            done

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.target }}
          path: |
            release-assets/*
          if-no-files-found: error

  release-update:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      # 统一上传本次构建的产物到 v$VERSION release
      - name: Publish build assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.VERSION }}
        run: |
          # 首次发布时 release 尚不存在，先创建
          gh release create "v${VERSION}" --title "ClashMorden ${VERSION}" --notes "" \
            2>/dev/null || true

          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            echo "upload: ${file}"
            # gh 上传大文件偶发 "Bad Content-Length"（HTTP 400），重试直到成功
            for attempt in 1 2 3 4 5; do
              if gh release upload "v${VERSION}" "${file}" --clobber; then
                echo "upload ok (attempt ${attempt}): ${file}"
                break
              fi
              echo "upload failed (attempt ${attempt}), retrying: ${file}"
              sleep 10
            done
          done

          # Remove stale updater/signature/legacy assets from an existing release.
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if ! find artifacts -type f -printf '%f\n' | grep -Fqx "$asset"; then
              gh release delete-asset "v${VERSION}" "$asset" --yes
            fi
          done < <(gh release view "v${VERSION}" --json assets --jq '.assets[].name')

      - name: Update release name and body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.VERSION }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_HASH}"
          {
            echo "Commit: [\`${COMMIT_HASH}\`](${COMMIT_URL})"
            echo "Version: ${VERSION}"
            echo ""
            # changelog 内容（去掉开头的 html 注释块模板占位）
            if [ -f CHANGELOG.md ]; then
              if head -n 1 CHANGELOG.md | grep -q '^<!--'; then
                sed '1,/^-->/d' CHANGELOG.md
              else
                cat CHANGELOG.md
              fi
            else
              echo "Release ${VERSION}"
            fi
          } > release-body.md
          gh release edit "v${VERSION}" \
            --title "ClashMorden ${VERSION}" \
            --notes-file release-body.md
